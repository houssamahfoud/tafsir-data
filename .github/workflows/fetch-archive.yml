name: Fetch archive.org text

# Downloads the OCR text (*_djvu.txt) of an archive.org item onto the
# archive-raw branch, so a tafsir only published as scanned books can be
# inspected and converted.
on:
  workflow_dispatch:
    inputs:
      item:
        description: archive.org item id
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ITEM: ${{ inputs.item }}
        run: |
          git fetch origin archive-raw && git checkout archive-raw || { git checkout --orphan archive-raw && git rm -rq --cached . && rm -rf -- * .github; }
          mkdir -p "$ITEM"
          curl -fsSL "https://archive.org/metadata/$ITEM" -o "$ITEM/metadata.json"
          for f in $(jq -r '.files[].name | select(endswith("_djvu.txt"))' "$ITEM/metadata.json"); do
            curl -fsSL "https://archive.org/download/$ITEM/$f" -o "$ITEM/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "archive.org $ITEM" && git push origin archive-raw
