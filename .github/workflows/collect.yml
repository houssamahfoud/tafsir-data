name: Collect results

# Every 30 minutes, writes the results of finished batches (and their token
# usage) to translations/
# and synthesis/, then commits them so the app can download them.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-repo-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no batch is pending
        id: pending
        run: |
          if grep -L '"usage":' jobs/*.json 2>/dev/null | grep -q .; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.pending.outputs.run == 'true'
        run: npm ci
      - if: steps.pending.outputs.run == 'true'
        run: node pipeline/collect.mjs
      - name: Publish the results
        if: steps.pending.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Collect batch results"
          git pull --rebase && git push
